name: Generate Multilingual Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - ".github/workflows/generate-dataset.yml"

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tidak lagi mem-pin agresif — pakai versi terbaru yang kompatibel.
          pip install datasets huggingface_hub

      - name: Preflight diagnostics
        run: |
          set -x
          pwd
          ls -la
          ls -la scripts || true
          python --version
          python -c "import datasets, sys; print('datasets', datasets.__version__); print('python', sys.version)"
          python -c "import fsspec; print('fsspec', fsspec.__version__)" || true
          python -c "import pyarrow; print('pyarrow', pyarrow.__version__)" || true
          python -c "import scripts.generate_dataset as g; print('import script OK')" || echo "[WARN] import script gagal (lihat traceback di atas)"

      - name: Run dataset generator (per language)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          for lang in id en zh fr ko; do
            echo "==================== [$lang] mulai ===================="
            python -u scripts/generate_dataset.py --lang "$lang"
            ec=$?
            echo "==================== [$lang] exit code: $ec ===================="
            echo "---- isi output/ setelah $lang ----"
            ls -la output || echo "(output/ belum ada)"
          done
          echo "==================== loop selesai ===================="
          ls -la output || echo "(output/ tidak pernah dibuat)"

      - name: Verify output files
        run: |
          set -e
          if [ ! -d output ]; then
            echo "ERROR: direktori 'output' tidak ada sama sekali."
            echo "Cek log step 'Run dataset generator' di atas."
            exit 1
          fi
          echo "---- isi output/ ----"
          ls -la output
          echo "---- ringkasan ----"
          missing=0
          for f in id en zh fr ko; do
            path="output/$f.jsonl"
            if [ ! -s "$path" ]; then
              echo "ERROR: $path missing or empty"
              missing=1
            else
              lines=$(wc -l < "$path")
              size=$(du -h "$path" | cut -f1)
              echo "OK: $path  ($lines lines, $size)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All output files present and non-empty."

      - name: Zip output
        run: |
          cd output
          zip -r ../dataset-150m.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-dataset-150m
          path: dataset-150m.zip
          retention-days: 30
          compression-level: 9
