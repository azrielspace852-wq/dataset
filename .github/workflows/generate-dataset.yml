name: Generate Multilingual Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - ".github/workflows/generate-dataset.yml"

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin fsspec & pyarrow untuk menghindari bug streaming + shutdown
          pip install \
            "datasets>=2.18,<3" \
            "huggingface_hub>=0.23" \
            "fsspec==2023.9.2" \
            "pyarrow>=14.0,<15"

      # Jalankan tiap bahasa di proses Python terpisah.
      # Kalau satu crash, bahasa lain tetap selesai.
      - name: Run dataset generator (per language)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          status=0
          for lang in id en zh fr ko; do
            echo "==================== [$lang] starting ===================="
            python scripts/generate_dataset.py --lang "$lang"
            ec=$?
            if [ $ec -ne 0 ]; then
              echo "[WARN] $lang exited with code $ec (output likely already written)"
              status=1
            else
              echo "[OK] $lang finished"
            fi
          done
          # Jangan gagalkan job: langkah verifikasi di bawah akan menentukan
          exit 0

      - name: Verify output files
        run: |
          set -e
          missing=0
          for f in id en zh fr ko; do
            path="output/$f.jsonl"
            if [ ! -s "$path" ]; then
              echo "ERROR: $path missing or empty"
              missing=1
            else
              lines=$(wc -l < "$path")
              size=$(du -h "$path" | cut -f1)
              echo "OK: $path  ($lines lines, $size)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "---- output dir content ----"
            ls -la output || true
            exit 1
          fi
          echo "All output files present and non-empty."

      - name: Zip output
        run: |
          cd output
          zip -r ../dataset-150m.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-dataset-150m
          path: dataset-150m.zip
          retention-days: 30
          compression-level: 9
