name: Generate Multilingual Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - ".github/workflows/generate-dataset.yml"

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "datasets>=2.18" "huggingface_hub>=0.23"

      # --- Login dihapus: HF_TOKEN cukup lewat env, dibaca otomatis oleh huggingface_hub ---
      - name: Run dataset generator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}   # alias lama, biar aman
        run: python scripts/generate_dataset.py

      - name: Zip output
        run: |
          cd output
          zip -r ../dataset-150m.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-dataset-150m
          path: dataset-150m.zip
          retention-days: 30
          compression-level: 9
