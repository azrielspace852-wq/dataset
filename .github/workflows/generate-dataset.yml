name: Generate Multilingual Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - ".github/workflows/generate-dataset.yml"

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin fsspec & pyarrow untuk menghindari bug streaming + shutdown
          pip install \
            "datasets>=2.18,<3" \
            "huggingface_hub>=0.23" \
            "fsspec==2023.9.2" \
            "pyarrow>=14.0,<15"

      - name: Run dataset generator
        continue-on-error: true          # <- penting: jangan gagalkan job karena crash exit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/generate_dataset.py

      - name: Verify output exists
        run: |
          test -f output/id.jsonl
          test -f output/en.jsonl
          test -f output/zh.jsonl
          test -f output/fr.jsonl
          test -f output/ko.jsonl
          echo "All output files exist."

      - name: Zip output
        run: |
          cd output
          zip -r ../dataset-150m.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-dataset-150m
          path: dataset-150m.zip
          retention-days: 30
          compression-level: 9 
