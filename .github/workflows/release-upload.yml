name: Upload to Release

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Format: tag1=link1, tag2=link2 (maks 6, pisah dengan koma)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Proses & Upload ke Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: azrielspace852-wq/dataset
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail

          IFS=',' read -ra ITEMS <<< "$CONFIG"

          if [ ${#ITEMS[@]} -gt 6 ]; then
            echo "::error::Maksimal 6 pasangan per run (ditemukan ${#ITEMS[@]})"
            exit 1
          fi

          # ---------- Downloader (artifact-aware) ----------
          download_file() {
            local url="$1"
            local dest="$2"

            # Deteksi URL UI artifact:
            # https://github.com/OWNER/REPO/actions/runs/RUN/artifacts/ART_ID
            if [[ "$url" =~ ^https?://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+)/artifacts/([0-9]+) ]]; then
              local owner="${BASH_REMATCH[1]}"
              local repo="${BASH_REMATCH[2]}"
              local art_id="${BASH_REMATCH[4]}"
              echo "🔍 GitHub Actions artifact terdeteksi: repo=$owner/$repo, artifact_id=$art_id"

              # --- Metode 1: gh api langsung (gh menangani redirect) ---
              if gh api -H "Accept: application/vnd.github+json" \
                        "/repos/$owner/$repo/actions/artifacts/$art_id/zip" > "$dest" 2>/dev/null; then
                if [ -s "$dest" ] && unzip -l "$dest" >/dev/null 2>&1; then
                  echo "✅ Artifact diunduh via gh api"
                  return 0
                fi
              fi

              echo "⚠️ gh api gagal / hasil bukan zip, coba metode metadata+curl..."

              # --- Metode 2: metadata → ambil redirect S3 tanpa kirim Authorization ke S3 ---
              local meta archive_url redirect_url
              meta="$(gh api "/repos/$owner/$repo/actions/artifacts/$art_id" 2>/dev/null || true)"
              archive_url="$(echo "$meta" | jq -r '.archive_download_url // empty')"

              if [ -z "$archive_url" ]; then
                echo "::error::Tidak dapat archive_download_url untuk artifact $art_id."
                echo "::error::Pastikan PAT (GH_PAT) punya akses ke $owner/$repo dan scope yang sesuai (repo / actions:read)."
                return 1
              fi

              redirect_url="$(curl -sS --no-location -o /dev/null -D - \
                                -H "Authorization: token $GH_TOKEN" \
                                -H "Accept: application/vnd.github+json" \
                                "$archive_url" 2>/dev/null \
                              | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[ \t]*/,""); sub(/\r$/,""); print; exit}')"

              if [ -z "$redirect_url" ]; then
                echo "::error::Tidak dapat redirect URL dari archive_download_url (artifact mungkin sudah kedaluwarsa/dihapus)."
                return 1
              fi

              curl -fsSL "$redirect_url" -o "$dest"
              return 0
            fi

            # --- URL biasa ---
            if ! ( wget -q --timeout=180 -O "$dest" "$url" \
                   || curl -fsSL --max-time 300 -o "$dest" "$url" ); then
              echo "::error::Download gagal: $url"
              return 1
            fi
          }

          # ---------- Cari zip terdalam (rekursif) ----------
          process_zip() {
            local file="$1"
            local work="$2"
            mkdir -p "$work/extracted"

            if ! unzip -o -q "$file" -d "$work/extracted" 2>/dev/null; then
              echo "::warning::Gagal extract $(basename "$file") — pakai apa adanya"
              echo "$file"
              return
            fi

            local inner=()
            while IFS= read -r -d '' z; do
              inner+=("$z")
            done < <(find "$work/extracted" -type f -iname "*.zip" -print0)

            if [ ${#inner[@]} -eq 0 ]; then
              echo "$file"
            else
              local c=0
              for iz in "${inner[@]}"; do
                c=$((c+1))
                process_zip "$iz" "$work/sub_$c"
              done
            fi
          }

          # ---------- Loop utama ----------
          for item in "${ITEMS[@]}"; do
            item="$(echo "$item" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$item" ] && continue

            tag="$(echo "$item"  | cut -d'=' -f1  | xargs)"
            link="$(echo "$item" | cut -d'=' -f2- | xargs)"

            if [ -z "$tag" ] || [ -z "$link" ]; then
              echo "::error::Format salah: '$item' (harus tag=link)"
              exit 1
            fi

            echo "::group::$tag <- $link"

            work="$(mktemp -d)"
            dl="$work/download"

            echo "⬇️ Download..."
            download_file "$link" "$dl" || exit 1

            to_upload=()
            if unzip -l "$dl" >/dev/null 2>&1; then
              mv "$dl" "$work/input.zip"
              mapfile -t inner_files < <(process_zip "$work/input.zip" "$work/ex")
              for f in "${inner_files[@]}"; do
                [ -n "$f" ] && [ -f "$f" ] && to_upload+=("$f")
              done
            else
              echo "::notice::File bukan zip → upload apa adanya"
              to_upload=("$dl")
            fi

            if [ ${#to_upload[@]} -eq 0 ]; then
              echo "::error::Tidak ada file yang bisa diupload untuk tag '$tag'"
              exit 1
            fi

            if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              echo "📦 Release '$tag' belum ada — dibuat."
              gh release create "$tag" -R "$REPO" --title "$tag" --notes "Release $tag"
            fi

            idx=0
            total=${#to_upload[@]}
            for f in "${to_upload[@]}"; do
              idx=$((idx+1))
              base="$(basename "$f")"
              ext="${base##*.}"

              if [ "$total" -eq 1 ]; then
                dest="$work/${tag}.${ext}"
              else
                dest="$work/${tag}_${idx}.${ext}"
              fi

              cp "$f" "$dest"
              gh release upload "$tag" "$dest" -R "$REPO" --clobber
              echo "✅ $(basename "$dest") → $tag"
            done

            rm -rf "$work"
            echo "::endgroup::"
          done

          echo "🎉 Semua selesai."
