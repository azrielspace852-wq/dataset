name: Upload to Release

on:
  # Hanya manual — TIDAK jalan otomatis saat push/commit
  workflow_dispatch:
    inputs:
      config:
        description: 'Format: tag1=link1, tag2=link2 (maks 6, pisah dengan koma)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Proses & Upload ke Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: azrielspace852-wq/dataset
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail

          IFS=',' read -ra ITEMS <<< "$CONFIG"

          if [ ${#ITEMS[@]} -gt 6 ]; then
            echo "::error::Maksimal 6 pasangan per run (ditemukan ${#ITEMS[@]})"
            exit 1
          fi

          # Fungsi rekursif: cari zip terdalam (yang tidak punya zip di dalamnya)
          process_zip() {
            local file="$1"
            local work="$2"
            mkdir -p "$work/extracted"

            if ! unzip -o -q "$file" -d "$work/extracted" 2>/dev/null; then
              echo "::warning::Gagal extract $file — pakai file ini apa adanya"
              echo "$file"
              return
            fi

            local inner=()
            while IFS= read -r -d '' z; do
              inner+=("$z")
            done < <(find "$work/extracted" -type f -iname "*.zip" -print0)

            if [ ${#inner[@]} -eq 0 ]; then
              # Tidak ada zip lagi → ini zip terdalam → upload ini
              echo "$file"
            else
              # Masih ada zip → gali lebih dalam
              local c=0
              for iz in "${inner[@]}"; do
                c=$((c+1))
                process_zip "$iz" "$work/sub_$c"
              done
            fi
          }

          for item in "${ITEMS[@]}"; do
            # Trim spasi
            item="$(echo "$item" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$item" ] && continue

            tag="$(echo "$item"  | cut -d'=' -f1  | xargs)"
            link="$(echo "$item" | cut -d'=' -f2- | xargs)"

            if [ -z "$tag" ] || [ -z "$link" ]; then
              echo "::error::Format salah: '$item' (harus tag=link)"
              exit 1
            fi

            echo "::group::$tag <- $link"

            work="$(mktemp -d)"
            dl="$work/download"

            echo "⬇️ Download..."
            if ! ( wget -q --timeout=180 -O "$dl" "$link" \
                   || curl -fsSL --max-time 300 -o "$dl" "$link" ); then
              echo "::error::Download gagal: $link"
              exit 1
            fi

            to_upload=()
            if unzip -l "$dl" >/dev/null 2>&1; then
              # File adalah zip → telusuri sampai ketemu zip terdalam
              mv "$dl" "$work/input.zip"
              mapfile -t inner_files < <(process_zip "$work/input.zip" "$work/ex")
              for f in "${inner_files[@]}"; do
                [ -n "$f" ] && [ -f "$f" ] && to_upload+=("$f")
              done
            else
              echo "::notice::File bukan zip → upload apa adanya"
              to_upload=("$dl")
            fi

            if [ ${#to_upload[@]} -eq 0 ]; then
              echo "::error::Tidak ada file yang bisa diupload untuk tag '$tag'"
              exit 1
            fi

            # Buat release kalau belum ada
            if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              echo "📦 Release '$tag' belum ada — dibuat."
              gh release create "$tag" -R "$REPO" --title "$tag" --notes "Release $tag"
            fi

            # Upload tiap file (biasanya 1, tapi kalau ada multiple zip terdalam tetap aman)
            idx=0
            total=${#to_upload[@]}
            for f in "${to_upload[@]}"; do
              idx=$((idx+1))
              base="$(basename "$f")"
              ext="${base##*.}"

              if [ "$total" -eq 1 ]; then
                dest="$work/${tag}.${ext}"
              else
                dest="$work/${tag}_${idx}.${ext}"
              fi

              cp "$f" "$dest"
              gh release upload "$tag" "$dest" -R "$REPO" --clobber
              echo "✅ $(basename "$dest") → $tag"
            done

            rm -rf "$work"
            echo "::endgroup::"
          done

          echo "🎉 Semua selesai."
