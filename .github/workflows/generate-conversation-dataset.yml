name: Generate Multilingual Conversation Dataset (200M)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_conversation_dataset.py"
      - ".github/workflows/generate-conversation-dataset.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets huggingface_hub

      - name: Preflight
        run: |
          python --version
          python -c "import datasets; print('datasets', datasets.__version__)"

      - name: Run dataset generator (per language)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          for lang in id en zh fr ko; do
            echo "==================== [$lang] start ===================="
            python -u scripts/generate_conversation_dataset.py --lang "$lang"
            echo "==================== [$lang] exit code: $? ===================="
            ls -la output || echo "(output/ belum ada)"
          done

      - name: Verify output
        run: |
          set -e
          test -d output || { echo "output/ tidak ada"; exit 1; }
          ls -la output
          for f in id en zh fr ko; do
            test -s "output/$f.jsonl" || { echo "MISSING: output/$f.jsonl"; exit 1; }
            lines=$(wc -l < "output/$f.jsonl")
            size=$(du -h "output/$f.jsonl" | cut -f1)
            echo "OK: output/$f.jsonl ($lines lines, $size)"
          done

      - name: Zip output
        run: |
          cd output
          zip -r ../conversation-200m.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-conversation-200m
          path: conversation-200m.zip
          retention-days: 30
          compression-level: 9
